apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: kube-system
spec:
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: home-assistant
  namespace: kube-system
subsets:
  - addresses:
      - ip: 192.168.0.3
    ports:
      - name: http
        port: 8123
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: kube-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - secretName: home-assistant-tls
      hosts:
        - ha.16w.eu
  rules:
    - host: ha.16w.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  name: http
