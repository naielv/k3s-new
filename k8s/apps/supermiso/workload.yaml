apiVersion: batch/v1
kind: Job
metadata:
  name: supermiso-initial-build-2
  namespace: supermiso
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: build
          image: hugomods/hugo:git-0.165.0@sha256:9e847af1818827bc9f15240e11020c4b93b02a0b430c830ff81b80550abdd59c
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /scripts/build.sh
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: site
              mountPath: /site
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: supermiso-site
        - name: scripts
          configMap:
            name: supermiso-site
            defaultMode: 0555
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: supermiso-rebuild
  namespace: supermiso
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: build
              image: hugomods/hugo:git-0.165.0@sha256:9e847af1818827bc9f15240e11020c4b93b02a0b430c830ff81b80550abdd59c
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/build.sh
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: site
                  mountPath: /site
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: site
              persistentVolumeClaim:
                claimName: supermiso-site
            - name: scripts
              configMap:
                name: supermiso-site
                defaultMode: 0555
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supermiso
  namespace: supermiso
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supermiso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supermiso
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: scripts
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: supermiso-site
        - name: scripts
          configMap:
            name: supermiso-site
---
apiVersion: v1
kind: Service
metadata:
  name: supermiso
  namespace: supermiso
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: supermiso
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supermiso
  namespace: supermiso
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - secretName: supermiso-tls
      hosts:
        - supermiso.com
  rules:
    - host: supermiso.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: supermiso
                port:
                  name: http
