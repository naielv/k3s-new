apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supermiso
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/naielv/k3s-new.git
    targetRevision: main
    path: k8s/apps/supermiso

  destination:
    server: https://kubernetes.default.svc
    namespace: supermiso

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
