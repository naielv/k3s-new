
apiVersion: v1
kind: ConfigMap
metadata:
  name: supermiso-site
  namespace: supermiso
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  build.sh: |
    #!/bin/sh
    set -eu

    SITE_ROOT=/site
    RELEASES_DIR="$SITE_ROOT/releases"
    LOCK_DIR="$SITE_ROOT/.build-lock"

    REPO_URL=https://git.16w.eu/EuskadiTech/SuperMiso.git

    KEEP_RELEASES=3
    LOCK_TIMEOUT=2400
    STALE_LOCK_AGE=2100

    SOURCE_DIR=
    BUILD_DIR=
    LOCKED=0

    mkdir -p "$SITE_ROOT" "$RELEASES_DIR"

    cleanup() {
      [ -z "$SOURCE_DIR" ] || rm -rf "$SOURCE_DIR"
      [ -z "$BUILD_DIR" ] || rm -rf "$BUILD_DIR"

      if [ "$LOCKED" -eq 1 ]; then
        rmdir "$LOCK_DIR" 2>/dev/null || true
      fi
    }

    trap cleanup EXIT
    trap 'exit 1' HUP INT TERM

    echo "Waiting for build lock..."

    waited=0

    while ! mkdir "$LOCK_DIR" 2>/dev/null; do
      if [ -d "$LOCK_DIR" ]; then
        lock_age=$(( $(date +%s) - $(stat -c %Y "$LOCK_DIR") ))

        if [ "$lock_age" -gt "$STALE_LOCK_AGE" ]; then
          echo "Removing stale build lock (${lock_age}s)" >&2
          rm -rf "$LOCK_DIR"
          continue
        fi
      fi

      if [ "$waited" -ge "$LOCK_TIMEOUT" ]; then
        echo "ERROR: Timed out waiting for build lock" >&2
        exit 1
      fi

      sleep 5
      waited=$((waited + 5))
    done

    LOCKED=1

    SOURCE_DIR=$(mktemp -d)
    BUILD_DIR=$(mktemp -d "$SITE_ROOT/.build.XXXXXX")

    export GIT_TERMINAL_PROMPT=0

    echo "Cloning website repository..."
    
    git clone \
      --depth 1 \
      --single-branch \
      --branch main \
      --recurse-submodules \
      "$REPO_URL" \
      "$SOURCE_DIR"

    git -C "$SOURCE_DIR" submodule update --init --recursive

    test -f "$SOURCE_DIR/themes/PaperMod/theme.toml" || {
      echo "ERROR: PaperMod submodule was not initialized correctly" >&2
      exit 1
    }

    echo "Building Hugo website..."

    hugo \
      --source "$SOURCE_DIR" \
      --destination "$BUILD_DIR" \
      --minify

    if [ ! -s "$BUILD_DIR/index.html" ]; then
      echo "ERROR: Hugo did not generate index.html" >&2
      exit 1
    fi

    echo "Build successful"

    release_name="$(date -u +%Y%m%d%H%M%S)-$$"
    RELEASE_DIR="$RELEASES_DIR/$release_name"

    echo "Publishing release: $release_name"

    mv "$BUILD_DIR" "$RELEASE_DIR"
    BUILD_DIR=

    NEXT_LINK="$SITE_ROOT/.current.$$"

    rm -f "$NEXT_LINK"
    ln -s "releases/$release_name" "$NEXT_LINK"

    mv -Tf "$NEXT_LINK" "$SITE_ROOT/current"

    echo "Published successfully"

    count=0

    for old_release in $(ls -1 "$RELEASES_DIR" | sort -r); do
      count=$((count + 1))

      if [ "$count" -gt "$KEEP_RELEASES" ]; then
        echo "Removing old release: $old_release"
        rm -rf "$RELEASES_DIR/$old_release"
      fi
    done

    echo "Build completed successfully"


  nginx.conf: |
    server {
      listen 80 default_server;
      server_name _;

      server_tokens off;

      root /usr/share/nginx/html/current;
      index index.html;

      charset utf-8;

      # Security headers
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;

      # Gzip compression
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_comp_level 5;
      gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

      # Health check
      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      # Do not expose hidden files
      location ~ /\. {
        deny all;
      }

      # Static assets
      location ~* \.(css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
      }

      # HTML and other resources
      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supermiso-site
  namespace: supermiso
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: moosefs-storage
  resources:
    requests:
      storage: 1Gi
