apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: prisma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
    spec:
      containers:
        - name: website
          image: ghcr.io/naielv/euskaditech:main@sha256:7e73a35eb6a6e2a52bd17da27e7f9b18916e1559ebcface53a055af5c0cc4290
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: super-website-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prisma-db-app
                  key: uri
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: prisma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: website
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: prisma
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # traefik.ingress.kubernetes.io/router.middlewares: crowdsec@file
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - secretName: website-tls
      hosts:
        - q.16w.eu
        - 16w.eu
        # - tech.eus
        - w.16w.eu
  rules:
    - host: q.16w.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  name: http
    - host: 16w.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  name: http
    # - host: tech.eus
    #   http:
    #     paths:
    #       - path: /
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: website
    #             port:
    #               name: http
    - host: w.16w.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  name: http
