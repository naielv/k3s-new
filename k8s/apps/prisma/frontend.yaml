apiVersion: apps/v1
kind: Deployment
metadata:
  name: prisma-frontend
  namespace: prisma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prisma-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prisma-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/naielv/prisma-frontend:latest@sha256:abd70c7879505eca5492be607e67a67686052ce2feea80e17ee7ec3a2fb5d412
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: prisma-frontend
  namespace: prisma
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prisma-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
