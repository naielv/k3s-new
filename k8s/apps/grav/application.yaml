apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grav
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/naielv/k8s.git
    targetRevision: main
    path: apps/grav

  destination:
    server: https://kubernetes.default.svc
    namespace: grav

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true