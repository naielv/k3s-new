controllers:
  main:
    containers:
      main:
        image:
          tag: v3.4.1
        env:
          TZ: Europe/Madrid

          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: host

          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: username

          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: password

          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: dbname

          DB_VECTOR_EXTENSION: vectorchord

valkey:
  enabled: true
  persistence:
    data:
      enabled: false
      type: emptyDir

immich:
  persistence:
    library:
      existingClaim: immich-library

machine-learning:
  enabled: false

server:
  controllers:
    main:
      replicas: 2
      containers:
        main:
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      pod:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: server
                app.kubernetes.io/instance: immich
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: letsencrypt-production
      hosts:
        - host: immich.16w.eu
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: immich-tls
          hosts:
            - immich.16w.eu
