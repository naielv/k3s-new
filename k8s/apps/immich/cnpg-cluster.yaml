apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie

  postgresql:
    shared_preload_libraries:
      - vchord.so

    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/

  bootstrap:
    initdb:
      database: immich
      owner: immich
      dataChecksums: true

  storage:
    storageClass: local-path
    size: 20Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
