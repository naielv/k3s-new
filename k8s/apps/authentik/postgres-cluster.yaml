apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-secrets
      dataChecksums: true

  storage:
    storageClass: moosefs-storage
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
