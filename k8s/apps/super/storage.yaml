apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nova-pb-data
  namespace: super
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: moosefs-storage
  resources:
    requests:
      storage: 10Gi
---
