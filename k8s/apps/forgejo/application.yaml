apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: 17.1.5
      helm:
        releaseName: forgejo
        valueFiles:
          - $values/k8s/apps/forgejo/values.yaml

    - repoURL: https://github.com/naielv/k3s-new.git
      targetRevision: main
      ref: values
      path: k8s/apps/forgejo/db

  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true